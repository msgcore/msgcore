    get:
      summary: "List webhook delivery attempts with filtering"
      description: "List webhook delivery attempts with filtering"
      operationId: "webhooksDeliveries"
      tags:
        - "Webhooks"
      security:
        -
          ApiKeyAuth:
            - "webhooks:read"
      parameters:
        -
          name: "project"
          in: "path"
          required: true
          schema:
            type: "string"
          description: "project parameter"
        -
          name: "webhookId"
          in: "path"
          required: true
          schema:
            type: "string"
          description: "webhookId parameter"
        -
          name: "webhookId"
          in: "query"
          required: true
          schema:
            type: "string"
          description: "Webhook ID"
        -
          name: "event"
          in: "query"
          required: false
          schema:
            type: "string"
          description: "Filter by event type"
        -
          name: "status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "pending"
              - "success"
              - "failed"
          description: "Filter by delivery status"
        -
          name: "limit"
          in: "query"
          required: false
          schema:
            type: "number"
            default: 50
          description: "Number of deliveries to return (1-100)"
        -
          name: "offset"
          in: "query"
          required: false
          schema:
            type: "number"
            default: 0
          description: "Number of deliveries to skip"
      responses:
        200:
          description: "Successful response"
          content:
            application/json:
              schema:
