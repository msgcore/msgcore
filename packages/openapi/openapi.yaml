        - "message"
        - "statusCode"
  securitySchemes:
    ApiKeyAuth:
      type: "apiKey"
      in: "header"
      name: "X-API-Key"
      description: "MsgCore API key from your project dashboard"
    BearerAuth:
      type: "http"
      scheme: "bearer"
